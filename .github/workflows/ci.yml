name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test check_api.sh
        run: ./check_api.sh https://httpbin.org/status/200
